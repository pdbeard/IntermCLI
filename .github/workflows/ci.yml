name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Dependency security audit
        run: |
          python -m pip install pip-audit
          # Audit only the runtime dependencies we actually ship (requests,
          # urllib3, rich, tomli). The full dev/build environment (setuptools,
          # black, pytest, ...) is intentionally not audited: those tools never
          # reach users, and auditing them just produces a stream of advisories
          # for the maintainer's toolchain.
          python -m pip_audit -r requirements.txt

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

      - name: Lint with ruff
        run: |
          ruff check tools/

      - name: Format check with black
        run: |
          black --check tools/

      - name: Run tests with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pytest-cov coveralls
          pytest --cov=tools --cov=shared --cov-report=term-missing --cov-report=xml
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'

      - name: Upload coverage to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install coveralls
          coveralls --service=github
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'

